services:
  omr-worker:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      - OMR_FIDUCIAL_WARP=crop
      - OMR_BBOX_SPAN_Y_BIAS_PX=4
      - OMR_BBOX_EXTRA_EDGE_PAD_PX=12
      - OMR_AUTO_HOMOGRAPHY_SKEW_DEG=5
      - GATEWAY_URL=http://localhost:4000
      - OMR_ALLOW_TEMPLATE_FALLBACK=1