# eCASVote — Nginx reverse proxy (Debian 13, TLS).
# Copy to the server, e.g.:
#   sudo cp nginx/ecasvote.conf /etc/nginx/sites-available/ecasvote.conf
#   sudo ln -sf /etc/nginx/sites-available/ecasvote.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Include this file only inside `http { ... }` (default for sites-available).
# Expects: frontend :3000, gateway :4000 (Docker host network). OMR :8090 is not exposed here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ecasvote_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ecasvote_gateway {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.1.6;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 192.168.1.6;

    ssl_certificate     /etc/nginx/ssl/ecasvote.crt;
    ssl_certificate_key /etc/nginx/ssl/ecasvote.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Browser uses relative /ecasvote-gateway/... → strip prefix for Express routes on :4000
    location /ecasvote-gateway/ {
        proxy_pass http://ecasvote_gateway/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Keep /api prefix — gateway serves /api/omr-layout/... (OMR worker calls gateway directly on :4000;
    # this block is for external HTTPS clients if needed).
    location /api/ {
        proxy_pass http://ecasvote_gateway/api/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://ecasvote_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
